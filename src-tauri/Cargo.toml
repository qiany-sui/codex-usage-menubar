[package]
name = "codex-usage"
version = "1.1.0"
edition = "2024"
build = "build.rs"
license = "MIT"
default-run = "codex-usage"

[[bin]]
name = "CodexUsageWatcher"
path = "src/watcher_main.rs"
required-features = ["macos-watcher"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
notify = "8"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
usage-core = { path = "../crates/usage-core" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-service-management = "0.3"
sha2 = "0.10"

[features]
custom-protocol = ["tauri/custom-protocol"]
macos-watcher = []

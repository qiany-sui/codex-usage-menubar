[package]
name = "codex-usage"
version = "1.1.0"
edition = "2024"
build = "build.rs"
license = "MIT"
default-run = "codex-usage"

[[bin]]
name = "CodexUsageWatcher"
path = "src/watcher_main.rs"
required-features = ["macos-watcher"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
notify = "8"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
usage-core = { path = "../crates/usage-core" }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_Packaging_Appx", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_Threading"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["CFNumber"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["CGGeometry", "CGWindow", "CGWindowLevel"] }
objc2-foundation = "0.3"
objc2-service-management = "0.3"
sha2 = "0.10"

[features]
custom-protocol = ["tauri/custom-protocol"]
macos-watcher = []
